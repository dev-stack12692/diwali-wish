<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Diwali</title>
<meta name="description" content="Wishing you a bright and joyful Diwali">
<meta property="og:title" content="Happy Diwali">
<meta property="og:description" content="Wishing you a bright and joyful Diwali">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Tiro+Devanagari+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #160f08;
    --bg-deep: #0f0a05;
    --gold: #d9a441;
    --gold-bright: #f0c569;
    --cream: #f4e8d2;
    --cream-dim: #cdbb9c;
    --clay: #8a4a2b;
    --clay-dark: #5f3018;
    --flame-core: #fff3c4;
    --flame-mid: #f6b23e;
    --flame-edge: #d96a1e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    overflow-x: hidden;
  }

  body {
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    color: var(--cream);
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    background:
      radial-gradient(ellipse 120% 70% at 50% 115%, rgba(217, 106, 30, 0.14), transparent 60%),
      radial-gradient(ellipse 90% 55% at 50% -15%, rgba(217, 164, 65, 0.07), transparent 65%),
      var(--bg);
  }

  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  /* ---------- greeting ---------- */
  .greeting {
    position: relative;
    z-index: 2;
    padding: 0 24px;
    animation: rise 1.6s cubic-bezier(.22,.8,.32,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(26px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hindi {
    font-family: 'Tiro Devanagari Serif', 'Cormorant Garamond', serif;
    font-size: clamp(1.05rem, 2.6vw + 0.6rem, 1.55rem);
    color: var(--gold);
    letter-spacing: 0.14em;
    margin-bottom: clamp(14px, 3vh, 26px);
    opacity: 0.92;
  }

  h1 {
    font-weight: 500;
    font-size: clamp(3rem, 11vw, 6.4rem);
    line-height: 1.02;
    letter-spacing: 0.015em;
    color: var(--gold-bright);
    text-shadow: 0 0 34px rgba(240, 197, 105, 0.22);
  }

  .rule {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: clamp(18px, 3.6vh, 30px) auto;
    width: min(320px, 62vw);
  }
  .rule::before, .rule::after {
    content: "";
    height: 1px;
    flex: 1;
    background: linear-gradient(to var(--dir, right), transparent, rgba(217,164,65,.55));
  }
  .rule::after { --dir: left; }
  .rule span {
    width: 7px; height: 7px;
    background: var(--gold);
    transform: rotate(45deg);
    box-shadow: 0 0 10px rgba(217,164,65,.6);
  }

  .wish {
    font-size: clamp(1.2rem, 2.4vw + 0.75rem, 1.7rem);
    font-style: italic;
    font-weight: 400;
    color: var(--cream-dim);
    max-width: 34ch;
    margin: 0 auto;
    line-height: 1.45;
  }

  /* ---------- diyas ---------- */
  .diyas {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: clamp(18px, 5vw, 52px);
    margin-top: clamp(34px, 7vh, 64px);
    padding: 0 16px;
  }

  .diya {
    position: relative;
    width: var(--s);
    height: calc(var(--s) * 0.62);
    animation: rise 1.6s cubic-bezier(.22,.8,.32,1) both;
  }
  .diya:nth-child(1) { --s: clamp(38px, 9vw, 58px); animation-delay: .45s; }
  .diya:nth-child(2) { --s: clamp(48px, 11vw, 74px); animation-delay: .3s; }
  .diya:nth-child(3) { --s: clamp(58px, 13vw, 92px); animation-delay: .15s; }
  .diya:nth-child(4) { --s: clamp(48px, 11vw, 74px); animation-delay: .3s; }
  .diya:nth-child(5) { --s: clamp(38px, 9vw, 58px); animation-delay: .45s; }

  .bowl {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 46%;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255, 214, 140, 0.28), transparent 55%),
      linear-gradient(180deg, var(--clay) 0%, var(--clay-dark) 100%);
    border-radius: 6% 6% 50% 50% / 12% 12% 120% 120%;
    box-shadow:
      inset 0 -4px 8px rgba(0,0,0,.45),
      0 6px 18px rgba(0,0,0,.5);
  }
  .bowl::before {
    content: "";
    position: absolute;
    top: -8%;
    left: -4%;
    width: 108%;
    height: 30%;
    background: linear-gradient(180deg, #a05a34, #7a3f22);
    border-radius: 50%;
    box-shadow: inset 0 2px 3px rgba(255,220,160,.35), inset 0 -3px 5px rgba(0,0,0,.5);
  }

  .flame-wrap {
    position: absolute;
    bottom: 46%;
    left: 50%;
    transform: translateX(-50%);
    width: 26%;
    height: 58%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .flame {
    position: relative;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at 50% 78%, var(--flame-core) 0%, var(--flame-mid) 42%, var(--flame-edge) 78%, transparent 100%);
    border-radius: 50% 50% 50% 50% / 68% 68% 32% 32%;
    transform-origin: 50% 92%;
    animation: flick 0.9s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 8px rgba(246,178,62,.75));
  }
  .flame::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 12%;
    transform: translateX(-50%);
    width: 42%;
    height: 44%;
    background: radial-gradient(ellipse at 50% 70%, #fffbe8, rgba(255,243,196,0) 72%);
    border-radius: 50%;
  }
  .diya:nth-child(odd) .flame { animation-duration: 1.13s; animation-delay: -.35s; }
  .diya:nth-child(3)  .flame { animation-duration: .82s; }

  @keyframes flick {
    0%   { transform: scaleY(1)    scaleX(1)    rotate(-1.6deg); }
    35%  { transform: scaleY(1.06) scaleX(.97)  rotate(1.2deg); }
    70%  { transform: scaleY(.97)  scaleX(1.03) rotate(-0.8deg); }
    100% { transform: scaleY(1.03) scaleX(.98)  rotate(1.8deg); }
  }

  .glow {
    position: absolute;
    bottom: 30%;
    left: 50%;
    transform: translateX(-50%);
    width: 340%;
    padding-top: 340%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(246,178,62,.20) 0%, rgba(246,178,62,.05) 42%, transparent 68%);
    animation: breathe 2.6s ease-in-out infinite alternate;
    pointer-events: none;
  }
  .diya:nth-child(2) .glow { animation-delay: -.9s; }
  .diya:nth-child(4) .glow { animation-delay: -1.4s; }
  .diya:nth-child(3) .glow { animation-duration: 2.1s; }

  @keyframes breathe {
    from { opacity: .65; }
    to   { opacity: 1; }
  }

  /* ---------- floating embers ---------- */
  .ember {
    position: fixed;
    bottom: -12px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,224,150,.95), rgba(246,178,62,.35) 60%, transparent 75%);
    pointer-events: none;
    z-index: 1;
    animation: float-up linear forwards;
  }

  @keyframes float-up {
    0%   { transform: translate(0, 0) scale(1); opacity: 0; }
    8%   { opacity: var(--o, .8); }
    85%  { opacity: var(--o, .8); }
    100% { transform: translate(var(--drift, 20px), -104vh) scale(.35); opacity: 0; }
  }

  footer {
    position: fixed;
    bottom: 14px;
    width: 100%;
    text-align: center;
    z-index: 2;
    font-size: 0.85rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(205, 187, 156, 0.4);
    font-family: 'Georgia', serif;
  }

  @media (max-height: 560px) {
    .diyas { margin-top: 22px; }
    footer { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .greeting, .diya { animation: none; }
    .flame { animation: none; }
    .glow { animation: none; opacity: .8; }
    .ember { display: none; }
  }
</style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>

  <main class="greeting">
    <p class="hindi">॥ शुभ दीपावली ॥</p>
    <h1>Happy Diwali</h1>
    <div class="rule" aria-hidden="true"><span></span></div>
    <p class="wish">Wishing you a bright and joyful Diwali</p>

    <div class="diyas" aria-hidden="true">
      <div class="diya"><div class="glow"></div><div class="flame-wrap"><div class="flame"></div></div><div class="bowl"></div></div>
      <div class="diya"><div class="glow"></div><div class="flame-wrap"><div class="flame"></div></div><div class="bowl"></div></div>
      <div class="diya"><div class="glow"></div><div class="flame-wrap"><div class="flame"></div></div><div class="bowl"></div></div>
      <div class="diya"><div class="glow"></div><div class="flame-wrap"><div class="flame"></div></div><div class="bowl"></div></div>
      <div class="diya"><div class="glow"></div><div class="flame-wrap"><div class="flame"></div></div><div class="bowl"></div></div>
    </div>
  </main>

  <footer>Festival of Lights</footer>

<script>
(function () {
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* floating embers */
  if (!reduceMotion) {
    var emberCount = 0;
    setInterval(function () {
      if (document.hidden || emberCount > 26) return;
      var e = document.createElement('div');
      e.className = 'ember';
      var size = 2 + Math.random() * 4;
      e.style.width = size + 'px';
      e.style.height = size + 'px';
      e.style.left = (4 + Math.random() * 92) + 'vw';
      e.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
      e.style.setProperty('--o', (0.35 + Math.random() * 0.5).toFixed(2));
      var dur = 9 + Math.random() * 9;
      e.style.animationDuration = dur + 's';
      document.body.appendChild(e);
      emberCount++;
      setTimeout(function () { e.remove(); emberCount--; }, dur * 1000 + 200);
    }, 900);
  }

  /* gentle fireworks */
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var W, H, rockets = [], sparks = [];

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  var GOLD = ['#f0c569', '#d9a441', '#ffe9b0', '#e8b04b'];

  function launch() {
    rockets.push({
      x: W * (0.15 + Math.random() * 0.7),
      y: H + 6,
      vy: -(H * 0.012 + Math.random() * H * 0.004),
      targetY: H * (0.07 + Math.random() * 0.17),
      color: GOLD[Math.floor(Math.random() * GOLD.length)]
    });
  }

  function burst(x, y, color) {
    var n = 42 + Math.floor(Math.random() * 22);
    for (var i = 0; i < n; i++) {
      var a = (Math.PI * 2 * i) / n + Math.random() * 0.22;
      var sp = 1.3 + Math.random() * 3.1;
      sparks.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        decay: 0.008 + Math.random() * 0.012,
        color: Math.random() < 0.75 ? color : GOLD[Math.floor(Math.random() * GOLD.length)],
        r: 1 + Math.random() * 1.4
      });
    }
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);

    for (var i = rockets.length - 1; i >= 0; i--) {
      var r = rockets[i];
      r.y += r.vy;
      r.vy *= 0.988;
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = r.color;
      ctx.beginPath();
      ctx.arc(r.x, r.y, 1.6, 0, Math.PI * 2);
      ctx.fill();
      if (r.y <= r.targetY || r.vy > -0.5) {
        burst(r.x, r.y, r.color);
        rockets.splice(i, 1);
      }
    }

    for (var j = sparks.length - 1; j >= 0; j--) {
      var s = sparks[j];
      s.x += s.vx;
      s.y += s.vy;
      s.vy += 0.022;
      s.vx *= 0.985;
      s.vy *= 0.985;
      s.life -= s.decay;
      if (s.life <= 0) { sparks.splice(j, 1); continue; }
      ctx.globalAlpha = Math.max(s.life, 0) * 0.9;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * s.life + 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }

  if (!reduceMotion) {
    tick();
    setTimeout(launch, 1200);
    setInterval(function () {
      if (!document.hidden && rockets.length < 2) launch();
    }, 3400);
  }
})();
</script>
</body>
</html>
